name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pandas 2.2+ supports numpy 2.x; older pandas (2.0/2.1) require
        # numpy 1.x and break against the numpy 2.x pulled in by pyarrow.
        pandas-version: ["2.2.3", "2.3.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==${{ matrix.pandas-version }}" "pyarrow>=10" pytest

      - name: Run tests
        run: pytest tests/ -q

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and sign
        run: ./build.sh
