name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas-version: ["2.0.3", "2.3.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==${{ matrix.pandas-version }}" "pyarrow>=10" pytest

      - name: Run tests
        run: pytest tests/ -q

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and sign
        run: ./build.sh
