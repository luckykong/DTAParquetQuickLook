name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2" "pyarrow>=10" pytest

      - name: Run tests
        run: pytest tests/ -q

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and sign
        run: ./build.sh
